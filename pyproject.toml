[project]
name = "cricket-stats"
version = "1.0.0"
description = "Hop 2 match ledger. Copies ScoreSnapshot totals. Two hops from cricket-protocol."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stats*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
